name: "Sync llms.txt"

# static/llms.txt and static/llms-full.txt are served at the site root
# (https://conduitdata.io/llms.txt), but they are generated in ConduitIO/conduit by
# `cmd/conduit/internal/llmsgen`. This job re-copies them from the latest Conduit
# release every day and opens a PR when they have drifted, so the committed copies
# cannot quietly go stale.
#
# The PR is deliberately NOT auto-merged. `main` is unprotected, has no required
# checks and no `on: pull_request` workflow, and merging deploys straight to
# conduitdata.io — so an auto-merge here would be an unreviewed write from another
# repository to production. A human reviews the diff.

on:
  workflow_dispatch:
  schedule:
    - cron: '0 7 * * *'

permissions:
  contents: write
  pull-requests: write

jobs:
  sync-llms-txt:
    runs-on: ubuntu-latest
    env:
      GITHUB_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4

      - name: Fetch llms.txt and llms-full.txt from the latest Conduit release
        run: |
          set -euo pipefail
          TAG=$(gh release view --repo ConduitIO/conduit --json tagName --jq .tagName)
          echo "Syncing from ConduitIO/conduit@$TAG"
          {
            echo "TAG<<__CONDUIT_TAG__"
            echo "$TAG"
            echo "__CONDUIT_TAG__"
          } >>"$GITHUB_ENV"

          for f in llms.txt llms-full.txt; do
            curl -fsSL --retry 3 --retry-all-errors \
              "https://raw.githubusercontent.com/ConduitIO/conduit/$TAG/$f" -o "$RUNNER_TEMP/$f"
            # A sanity check, not an integrity check: it catches an HTML error page or a
            # truncated download, which is all it is here for. Provenance comes from the
            # tag being a ConduitIO/conduit release, and from a human reviewing the PR.
            if ! grep -q 'Code generated by cmd/conduit/internal/llmsgen' "$RUNNER_TEMP/$f"; then
              echo "::error::$f from $TAG is missing the llmsgen header, refusing to sync"
              exit 1
            fi
            mv "$RUNNER_TEMP/$f" "static/$f"
          done

      - name: Create pull request
        uses: peter-evans/create-pull-request@v7.0.8
        with:
          title: "Sync llms.txt from ConduitIO/conduit ${{ env.TAG }}"
          body: |
            `static/llms.txt` and `static/llms-full.txt` are copies of the files generated at the root
            of [`ConduitIO/conduit`](https://github.com/ConduitIO/conduit), served at
            <https://conduitdata.io/llms.txt> and <https://conduitdata.io/llms-full.txt>.

            They drifted from `ConduitIO/conduit@${{ env.TAG }}` (the latest Conduit release), so this
            pull request was opened automatically to bring them back in line. It is not
            auto-merged: merging deploys to conduitdata.io, so please read the diff.
          branch: sync-llms-txt
          commit-message: "[automated] Sync llms.txt from ConduitIO/conduit ${{ env.TAG }}"
          # Without this the action commits anything else dirty in the tree.
          add-paths: |
            static/llms.txt
            static/llms-full.txt
